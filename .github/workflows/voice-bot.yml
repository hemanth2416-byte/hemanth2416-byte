name: Voice bot game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: voice-bot
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|') || startsWith(github.event.issue.title, 'ask|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: python scripts/voice_bot.py

      - name: Commit board
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "voice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          git diff --cached --quiet || git commit -m "voice-bot: $ISSUE_USER played"
          git pull --rebase
          git push

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
