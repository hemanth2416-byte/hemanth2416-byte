<text x="470" y="160" font-size="18" font-weight="800" fill="#e6edf3">Hireanex</text><text class="m" x="470" y="182" font-size="11" fill="#f472b6">Lead Full-Stack AI Engineer · May 2022 – present</text><text x="470" y="210" font-size="13" fill="#8b949e"><tspan fill="#f472b6">▸ </tspan>Real-time voice engine · STT → LLM → TTS, barge-in</text><text x="470" y="232" font-size="13" fill="#8b949e"><tspan fill="#f472b6">▸ </tspan>LoRA fine-tunes (PyTorch, HF, CUDA) served on vLLM</text><text x="470" y="254" font-size="13" fill="#8b949e"><tspan fill="#f472b6">▸ </tspan>Forward deployed with pilot customers</text><text x="470" y="276" font-size="13" fill="#8b949e"><tspan fill="#f472b6">▸ </tspan>Customer feedback shipped in days</text>

