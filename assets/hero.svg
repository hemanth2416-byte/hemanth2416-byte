.b{fill:url(#wave);transform-box:fill-box;transform-origin:center;animation:pulse 1s ease-in-out infinite alternate;}
@keyframes pulse{0%{transform:scaleY(.18);opacity:.55}100%{transform:scaleY(1);opacity:1}}
.dot{animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.head{animation:sweep 7s linear infinite;}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(770px)}}
.fade{animation:fadein 1.2s ease-out both;}
.fade2{animation:fadein 1.2s ease-out .5s both;}
.fade3{animation:fadein 1.2s ease-out 1s both;}
@keyframes fadein{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

</style>
