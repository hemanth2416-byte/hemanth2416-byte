<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Streaming voice pipeline: mic, VAD, STT, LLM, TTS, speaker; async evidence pipeline">
<title>Streaming voice pipeline: mic, VAD, STT, LLM, TTS, speaker; async evidence pipeline</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>

</defs>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

.flow{animation:dash 1.2s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-28}}
.barge{stroke-dasharray:6 6;animation:dash2 1s linear infinite;}
@keyframes dash2{to{stroke-dashoffset:-24}}
.pill{animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}

</style>
<rect x="1" y="1" width="898" height="428" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

<text class="m" x="30" y="44" font-size="12" fill="#22d3ee" letter-spacing="2">LANE 1 · REAL-TIME</text>
<text x="30" y="66" font-size="13" fill="#8b949e">During the interview. Every stage streams; nothing waits for the previous stage to finish.</text>
