stroke="#34d399" stroke-width="1.6"/><text x="450.0" y="357.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">EVIDENCE</text><text class="m" x="450.0" y="374.0" font-size="9.5" fill="#34d399" text-anchor="middle">worker</text><rect x="576.0" y="330" width="112" height="58" rx="12" fill="#0d1117" stroke="#34d399" stroke-width="1.6"/><text x="632.0" y="357.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">SCORES</text><text class="m" x="632.0" y="374.0" font-size="9.5" fill="#34d399" text-anchor="middle">cite evidence</text><rect x="758.0" y="330" width="112" height="58" rx="12" fill="#0d1117" stroke="#fbbf24" stroke-width="1.6"/><text x="814.0" y="357.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">REPORT</text><text class="m" x="814.0" y="374.0" font-size="9.5" fill="#fbbf24" text-anchor="middle">auditable</text><text class="m" x="177.0" y="324" font-size="9" fill="#8b949e" text-anchor="middle">queue</text><text class="m" x="359.0" y="324" font-size="9" fill="#8b949e" text-anchor="middle">queue</text><text class="m" x="541.0" y="324" font-size="9" fill="#8b949e" text-anchor="middle">queue</text><text class="m" x="723.0" y="324" font-size="9" fill="#8b949e" text-anchor="middle">queue</text>
<text class="m" x="450" y="414" font-size="10.5" fill="#8b949e" text-anchor="middle">Node/Fastify · PostgreSQL (Neon) · REST + WebSocket · interview lifecycle state machine</text>

