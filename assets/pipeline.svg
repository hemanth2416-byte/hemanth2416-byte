rx="12" fill="#0d1117" stroke="#22d3ee" stroke-width="1.6"/><text x="377.2" y="177.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">STT</text><text class="m" x="377.2" y="194.0" font-size="9.5" fill="#22d3ee" text-anchor="middle">partials</text><rect x="466.79999999999995" y="150" width="112" height="58" rx="12" fill="#0d1117" stroke="#a78bfa" stroke-width="1.6"/><text x="522.8" y="177.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">LLM</text><text class="m" x="522.8" y="194.0" font-size="9.5" fill="#a78bfa" text-anchor="middle">token stream</text><rect x="612.4" y="150" width="112" height="58" rx="12" fill="#0d1117" stroke="#f472b6" stroke-width="1.6"/><text x="668.4" y="177.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">TTS</text><text class="m" x="668.4" y="194.0" font-size="9.5" fill="#f472b6" text-anchor="middle">audio chunks</text><rect x="758.0" y="150" width="112" height="58" rx="12" fill="#0d1117" stroke="#f472b6" stroke-width="1.6"/><text x="814.0" y="177.0" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">SPEAKER</text><text class="m" x="814.0" y="194.0" font-size="9.5" fill="#f472b6" text-anchor="middle">plays live</text><text class="m" x="158.8" y="144" font-size="9" fill="#8b949e" text-anchor="middle">stream</text><text class="m" x="304.4" y="144" font-size="9" fill="#8b949e" text-anchor="middle">stream</text><text class="m" x="450.0" y="144" font-size="9" fill="#8b949e" text-anchor="middle">stream</text><text class="m" x="595.6" y="144" font-size="9" fill="#8b949e" text-anchor="middle">stream</text><text class="m" x="741.2" y="144" font-size="9" fill="#8b949e" text-anchor="middle">stream</text>
<line x1="30" y1="248" x2="870" y2="248" stroke="#30363d" stroke-dasharray="2 6"/>
<text class="m" x="30" y="282" font-size="12" fill="#34d399" letter-spacing="2">LANE 2 · ASYNC</text>
<text x="30" y="304" font-size="13" fill="#8b949e">After the interview. BullMQ queues + idempotent workers: every step safe to retry.</text>
