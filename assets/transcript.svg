<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-label="Mock live transcript: a visitor interviews the AI interviewer about Hemanth">
<title>Mock live transcript: a visitor interviews the AI interviewer about Hemanth</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="wave" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>

</defs>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

.msg{animation:speak 18s linear infinite;}
@keyframes speak{0%{opacity:1}9%{opacity:1}12%{opacity:.6}97%{opacity:.6}100%{opacity:1}}
.mw{transform-box:fill-box;transform-origin:center;animation:mw .9s ease-in-out infinite alternate;}
@keyframes mw{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.dot{animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

</style>
<rect x="1" y="1" width="898" height="1078" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
<rect x="1" y="1" width="898" height="52" rx="16" fill="#111827"/>
<rect x="1" y="38" width="898" height="15" fill="#111827"/>
<line x1="1" y1="53" x2="899" y2="53" stroke="#30363d"/>
<circle class="dot" cx="30" cy="27" r="5" fill="#f87171"/>
<text class="m" x="44" y="31" font-size="12" fill="#e6edf3" letter-spacing="1">REC · live transcript</text>
<text class="m" x="872" y="31" font-size="11" fill="#8b949e" text-anchor="end">mock session · the interviewer, interviewed</text><g class="msg" style="animation-delay:0.0s"><text class="m" x="812" y="84" font-size="10" fill="#8b949e" text-anchor="end" letter-spacing="1.5">VISITOR</text><rect x="552" y="92" width="260" height="44" rx="16" fill="#0e2a3a" stroke="#22d3ee66"/><circle cx="846" cy="110" r="16" fill="#0e2a3a" stroke="#22d3ee88"/><g fill="#22d3ee"><circle cx="846" cy="105" r="5"/><path d="M836 120 q10 -12 20 0" stroke="#22d3ee" stroke-width="3" fill="none"/></g><text x="570" y="118" font-size="15" fill="#cffafe">Who is Hemanth, in one line?</text></g><g class="msg" style="animation-delay:-16.0s"><text class="m" x="88" y="164" font-size="10" fill="#a78bfa" letter-spacing="1.5">AI INTERVIEWER</text><rect x="88" y="172" width="532" height="88" rx="16" fill="#1c1636" stroke="#a78bfa66"/><circle cx="54" cy="190" r="16" fill="#1c1636" stroke="#a78bfa88"/><rect class="mw" x="44.0" y="187.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:0.00s"/><rect class="mw" x="48.5" y="184.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.15s"/><rect class="mw" x="53.0" y="182.0" width="2.6" height="16" rx="1.3" fill="#a78bfa" style="animation-delay:-0.30s"/><rect class="mw" x="57.5" y="184.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.45s"/><rect class="mw" x="62.0" y="187.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:-0.60s"/><text x="106" y="198" font-size="15" fill="#ede9fe">Software engineer first. AI is how he builds, not a substitute</text><text x="106" y="220" font-size="15" fill="#ede9fe">for engineering. 7+ years; Lead Full-Stack AI Engineer at</text><text x="106" y="242" font-size="15" fill="#ede9fe">Hireanex since May 2022.</text><rect x="102" y="268" width="301" height="22" rx="11" fill="#0f2a22" stroke="#34d39966"/><text class="m" x="114" y="283" font-size="11" fill="#34d399">✓ evidence · <tspan fill="#a7f3d0">Hireanex · May 2022 – present</tspan></text></g><g class="msg" style="animation-delay:-14.0s"><text class="m" x="812" y="322" font-size="10" fill="#8b949e" text-anchor="end" letter-spacing="1.5">VISITOR</text><rect x="456" y="330" width="356" height="44" rx="16" fill="#0e2a3a" stroke="#22d3ee66"/><circle cx="846" cy="348" r="16" fill="#0e2a3a" stroke="#22d3ee88"/><g fill="#22d3ee"><circle cx="846" cy="343" r="5"/><path d="M836 358 q10 -12 20 0" stroke="#22d3ee" stroke-width="3" fill="none"/></g><text x="474" y="356" font-size="15" fill="#cffafe">Has he actually shipped real-time voice?</text></g><g class="msg" style="animation-delay:-12.0s"><text class="m" x="88" y="402" font-size="10" fill="#a78bfa" letter-spacing="1.5">AI INTERVIEWER</text><rect x="88" y="410" width="516" height="88" rx="16" fill="#1c1636" stroke="#a78bfa66"/><circle cx="54" cy="428" r="16" fill="#1c1636" stroke="#a78bfa88"/><rect class="mw" x="44.0" y="425.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:0.00s"/><rect class="mw" x="48.5" y="422.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.15s"/><rect class="mw" x="53.0" y="420.0" width="2.6" height="16" rx="1.3" fill="#a78bfa" style="animation-delay:-0.30s"/><rect class="mw" x="57.5" y="422.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.45s"/><rect class="mw" x="62.0" y="425.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:-0.60s"/><text x="106" y="436" font-size="15" fill="#ede9fe">Yes. He built Hireanex's voice engine: streaming STT → LLM →</text><text x="106" y="458" font-size="15" fill="#ede9fe">streaming TTS, with voice activity detection and barge-in</text><text x="106" y="480" font-size="15" fill="#ede9fe">handling. It is live with real users and pilot customers.</text><rect x="102" y="506" width="328" height="22" rx="11" fill="#0f2a22" stroke="#34d39966"/><text class="m" x="114" y="521" font-size="11" fill="#34d399">✓ evidence · <tspan fill="#a7f3d0">Hireanex · real-time voice engine</tspan></text></g><g class="msg" style="animation-delay:-10.0s"><text class="m" x="812" y="560" font-size="10" fill="#8b949e" text-anchor="end" letter-spacing="1.5">VISITOR</text><rect x="432" y="568" width="380" height="44" rx="16" fill="#0e2a3a" stroke="#22d3ee66"/><circle cx="846" cy="586" r="16" fill="#0e2a3a" stroke="#22d3ee88"/><g fill="#22d3ee"><circle cx="846" cy="581" r="5"/><path d="M836 596 q10 -12 20 0" stroke="#22d3ee" stroke-width="3" fill="none"/></g><text x="450" y="594" font-size="15" fill="#cffafe">Why should anyone trust an AI hiring score?</text></g><g class="msg" style="animation-delay:-8.0s"><text class="m" x="88" y="640" font-size="10" fill="#a78bfa" letter-spacing="1.5">AI INTERVIEWER</text><rect x="88" y="648" width="548" height="88" rx="16" fill="#1c1636" stroke="#a78bfa66"/><circle cx="54" cy="666" r="16" fill="#1c1636" stroke="#a78bfa88"/><rect class="mw" x="44.0" y="663.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:0.00s"/><rect class="mw" x="48.5" y="660.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.15s"/><rect class="mw" x="53.0" y="658.0" width="2.6" height="16" rx="1.3" fill="#a78bfa" style="animation-delay:-0.30s"/><rect class="mw" x="57.5" y="660.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.45s"/><rect class="mw" x="62.0" y="663.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:-0.60s"/><text x="106" y="674" font-size="15" fill="#ede9fe">They don't have to take it on faith. Every score on his platform</text><text x="106" y="696" font-size="15" fill="#ede9fe">is tied to transcript evidence, so it is explainable and</text><text x="106" y="718" font-size="15" fill="#ede9fe">auditable.</text><rect x="102" y="744" width="315" height="22" rx="11" fill="#0f2a22" stroke="#34d39966"/><text class="m" x="114" y="759" font-size="11" fill="#34d399">✓ evidence · <tspan fill="#a7f3d0">Hireanex · LLM evaluation layer</tspan></text></g><g class="msg" style="animation-delay:-6.0s"><text class="m" x="812" y="798" font-size="10" fill="#8b949e" text-anchor="end" letter-spacing="1.5">VISITOR</text><rect x="600" y="806" width="212" height="44" rx="16" fill="#0e2a3a" stroke="#22d3ee66"/><circle cx="846" cy="824" r="16" fill="#0e2a3a" stroke="#22d3ee88"/><g fill="#22d3ee"><circle cx="846" cy="819" r="5"/><path d="M836 834 q10 -12 20 0" stroke="#22d3ee" stroke-width="3" fill="none"/></g><text x="618" y="832" font-size="15" fill="#cffafe">And underneath the AI?</text></g><g class="msg" style="animation-delay:-4.0s"><text class="m" x="88" y="878" font-size="10" fill="#a78bfa" letter-spacing="1.5">AI INTERVIEWER</text><rect x="88" y="886" width="500" height="88" rx="16" fill="#1c1636" stroke="#a78bfa66"/><circle cx="54" cy="904" r="16" fill="#1c1636" stroke="#a78bfa88"/><rect class="mw" x="44.0" y="901.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:0.00s"/><rect class="mw" x="48.5" y="898.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.15s"/><rect class="mw" x="53.0" y="896.0" width="2.6" height="16" rx="1.3" fill="#a78bfa" style="animation-delay:-0.30s"/><rect class="mw" x="57.5" y="898.0" width="2.6" height="12" rx="1.3" fill="#a78bfa" style="animation-delay:-0.45s"/><rect class="mw" x="62.0" y="901.0" width="2.6" height="6" rx="1.3" fill="#a78bfa" style="animation-delay:-0.60s"/><text x="106" y="912" font-size="15" fill="#ede9fe">Infrastructure roots. At Zingaro AI he moved services to</text><text x="106" y="934" font-size="15" fill="#ede9fe">Docker/Kubernetes across 5+ environments (~60% less config</text><text x="106" y="956" font-size="15" fill="#ede9fe">drift) and cut cloud cost by 15%+.</text><rect x="102" y="982" width="268" height="22" rx="11" fill="#0f2a22" stroke="#34d39966"/><text class="m" x="114" y="997" font-size="11" fill="#34d399">✓ evidence · <tspan fill="#a7f3d0">Zingaro AI · 2019 – 2022</tspan></text></g><g><text class="m" x="88" y="1048" font-size="11" fill="#8b949e" letter-spacing="1.5">LISTENING</text><rect class="mw" x="180" y="1042.0" width="3" height="4.0" rx="1.5" fill="#22d3ee" style="animation-delay:0.00s"/><rect class="mw" x="186" y="1038.4132195455024" width="3" height="11.2" rx="1.5" fill="#22d3ee" style="animation-delay:-0.09s"/><rect class="mw" x="192" y="1037.0021319847924" width="3" height="14.0" rx="1.5" fill="#22d3ee" style="animation-delay:-0.18s"/><rect class="mw" x="198" y="1038.6226840972442" width="3" height="10.8" rx="1.5" fill="#22d3ee" style="animation-delay:-0.27s"/><rect class="mw" x="204" y="1041.708129282862" width="3" height="4.6" rx="1.5" fill="#22d3ee" style="animation-delay:-0.36s"/><rect class="mw" x="210" y="1038.2159875234604" width="3" height="11.6" rx="1.5" fill="#22d3ee" style="animation-delay:-0.45s"/><rect class="mw" x="216" y="1037.0191769558207" width="3" height="14.0" rx="1.5" fill="#22d3ee" style="animation-delay:-0.54s"/><rect class="mw" x="222" y="1038.8436668106383" width="3" height="10.3" rx="1.5" fill="#22d3ee" style="animation-delay:-0.63s"/><rect class="mw" x="228" y="1041.4172539757476" width="3" height="5.2" rx="1.5" fill="#22d3ee" style="animation-delay:-0.72s"/><rect class="mw" x="234" y="1038.0316606807542" width="3" height="11.9" rx="1.5" fill="#22d3ee" style="animation-delay:-0.81s"/><rect class="mw" x="240" y="1037.053208766883" width="3" height="13.9" rx="1.5" fill="#22d3ee" style="animation-delay:-0.90s"/><rect class="mw" x="246" y="1039.0754140355411" width="3" height="9.8" rx="1.5" fill="#22d3ee" style="animation-delay:-0.99s"/><rect class="mw" x="252" y="1041.128366093885" width="3" height="5.7" rx="1.5" fill="#22d3ee" style="animation-delay:-1.08s"/><rect class="mw" x="258" y="1037.8608676545716" width="3" height="12.3" rx="1.5" fill="#22d3ee" style="animation-delay:-1.17s"/><rect class="mw" x="264" y="1037.1041113542435" width="3" height="13.8" rx="1.5" fill="#22d3ee" style="animation-delay:-1.26s"/><rect class="mw" x="270" y="1039.3171354099977" width="3" height="9.4" rx="1.5" fill="#22d3ee" style="animation-delay:-1.35s"/><rect class="mw" x="276" y="1040.8424508744922" width="3" height="6.3" rx="1.5" fill="#22d3ee" style="animation-delay:-1.44s"/><rect class="mw" x="282" y="1037.7041909257175" width="3" height="12.6" rx="1.5" fill="#22d3ee" style="animation-delay:-1.53s"/><rect class="mw" x="288" y="1037.1717111172536" width="3" height="13.7" rx="1.5" fill="#22d3ee" style="animation-delay:-1.62s"/><rect class="mw" x="294" y="1039.568006555731" width="3" height="8.9" rx="1.5" fill="#22d3ee" style="animation-delay:-1.71s"/><rect class="mw" x="300" y="1040.5604834166747" width="3" height="6.9" rx="1.5" fill="#22d3ee" style="animation-delay:-1.80s"/><rect class="mw" x="306" y="1037.5621648320925" width="3" height="12.9" rx="1.5" fill="#22d3ee" style="animation-delay:-1.89s"/><rect class="mw" x="312" y="1037.2557775104094" width="3" height="13.5" rx="1.5" fill="#22d3ee" style="animation-delay:-1.98s"/><rect class="mw" x="318" y="1039.8271718896406" width="3" height="8.3" rx="1.5" fill="#22d3ee" style="animation-delay:-2.07s"/><text class="m" x="340" y="1048" font-size="11" fill="#8b949e">VAD armed · barge-in enabled · speak anytime</text></g>
